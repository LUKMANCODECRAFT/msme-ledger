<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient in Forest Green -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#143621" />
    </linearGradient>

    <!-- Warm Cream Page Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0C0F0E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Outer Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#forestGrad)" stroke="#2D6A4F" stroke-width="8" />

  <!-- Inner Soft Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#D8ECE1" stroke-width="2" stroke-opacity="0.25" />

  <!-- Ledger Book Graphics with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Book Spine / Base Shadow -->
    <path d="M120 376 C170 360, 240 360, 256 376 C272 360, 342 360, 392 376 L392 392 C342 376, 272 376, 256 392 C240 376, 170 376, 120 392 Z" fill="#141816" opacity="0.4" />

    <!-- Left Page -->
    <path d="M120 156 C176 142, 236 148, 252 168 L252 364 C236 348, 176 342, 120 356 Z" fill="url(#creamGrad)" stroke="#E5DCC5" stroke-width="3" />

    <!-- Right Page -->
    <path d="M392 156 C336 142, 276 148, 260 168 L260 364 C276 348, 336 342, 392 356 Z" fill="url(#creamGrad)" stroke="#E5DCC5" stroke-width="3" />

    <!-- Center Spine Seam -->
    <line x1="256" y1="168" x2="256" y2="368" stroke="#D5C8AB" stroke-width="4" stroke-linecap="round" />

    <!-- Left Page Ledger Lines (Financial Bars) -->
    <line x1="146" y1="200" x2="226" y2="200" stroke="#1B4332" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="146" y1="236" x2="226" y2="236" stroke="#5C6460" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="146" y1="272" x2="206" y2="272" stroke="#5C6460" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" />
    <line x1="146" y1="308" x2="216" y2="308" stroke="#5C6460" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" />

    <!-- Right Page Naira Financial Symbol (₦) -->
    <!-- Distinct, bold Naira mark in Forest Green -->
    <g transform="translate(320, 252)">
      <!-- Central Bold 'N' -->
      <path d="M-30 36 L-30 -36 L-10 -36 L12 14 L12 -36 L30 -36 L30 36 L10 36 L-12 -14 L-12 36 Z" fill="#1B4332" />
      <!-- Double Horizontal Bars -->
      <line x1="-36" y1="-7" x2="36" y2="-7" stroke="#1B4332" stroke-width="6" stroke-linecap="round" />
      <line x1="-36" y1="7" x2="36" y2="7" stroke="#1B4332" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Golden/Sand Corner Sparkle -->
  <circle cx="392" cy="120" r="12" fill="#D8ECE1" />
  <circle cx="416" cy="144" r="6" fill="#D8ECE1" opacity="0.75" />
</svg>
